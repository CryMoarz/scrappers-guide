# Publishes the image NOMAD and other hosts install, for x86 and ARM, to GitHub's container
# registry (ghcr.io, which NOMAD trusts). To release: set "version" in package.json, build the
# app with the maintainer key (node tools/build.js --key maintainer.key) and commit it, then
#   git tag v3.0.1 && git push --tags
# The image ships the committed app as it is: signed, so apps that sync with its hub can be
# offered the update.
# NOMAD tracks updates by version number, so every release gets one (3.0.1, and 3.0 for the
# latest 3.0.x); "latest" is published too, but NOMAD warns against installing it.
# The first time, make the package public: GitHub → your profile → Packages → scrappers-guide →
# Package settings → Change visibility.
# This job can push the public image, so everything it runs is pinned: actions to full commit
# hashes (the release in a comment) and the two images they pull to digests (the release in the
# tag). Dependabot proposes new actions; it can't see those images, so refresh them by hand now
# and then (docker buildx imagetools inspect <image:tag> prints the digest). No caches are used.
name: Release image
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Nothing is built here: the hub makes its release from data/ as it runs, and the app must
      # be the committed one, signed for this version from this code, or the job stops.
      - name: The app is this release's, signed by a maintainer
        run: node tools/verify-app.js --release
      - run: node tools/validate.js
      - run: node --test test/*.test.js
      # Emulation for the ARM build (the runner is x86).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          cache-binary: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names must be lowercase
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/scrappers-guide
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
