# Every push and pull request: every record valid, every reference resolves, the committed app
# is the signed release, every test passes, on each Node version people run it with (20 has no
# built-in SQLite, so it tests the file store).
name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node tools/validate.js
      # The committed app must stay the signed release that hubs serve and the image ships (on a
      # tag, this version's, built from this code). Before anything rebuilds it.
      - run: node tools/verify-app.js
      # The tests build the app from this source in memory, so they test this commit's code.
      - run: node --test test/*.test.js
      # And the build itself must work: unsigned, here only (it rewrites app/ in this checkout).
      - run: node tools/build.js
