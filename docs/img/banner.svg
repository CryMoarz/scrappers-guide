<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Scrapper’s Digital Guide to the Apocalypse</title>
  <desc id="d">I need this part. What should I strip, and where should I look? An offline salvage guide for phones, Raspberry Pis, cyberdecks and Project NOMAD.</desc>
  <defs>
    <clipPath id="card"><rect width="1280" height="400" rx="18"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#24323B" stroke-width="1.5"/>
    </pattern>
    <pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#E5AE17"/>
      <rect x="14" width="14" height="28" fill="#1B2A35"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E5AE17" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E5AE17" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#1B2A35"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="16" fill="url(#hazard)"/>
    <rect y="384" width="1280" height="16" fill="url(#hazard)"/>

    <!-- emblem: a gear with a lightning bolt, the guide's "power from salvage" -->
    <circle cx="190" cy="200" r="150" fill="url(#glow)"/>
    <circle cx="190" cy="200" r="112" fill="none" stroke="#E5AE17" stroke-width="5"/>
    <circle cx="190" cy="200" r="100" fill="none" stroke="#33434D" stroke-width="2" stroke-dasharray="4 8"/>
    <circle cx="190" cy="200" r="70" fill="none" stroke="#E1E6E0" stroke-width="22" stroke-dasharray="21.99 21.99"/>
    <circle cx="190" cy="200" r="56" fill="none" stroke="#E1E6E0" stroke-width="18"/>
    <circle cx="190" cy="200" r="46" fill="#1B2A35"/>
    <path d="M200 156 L168 206 H188 L180 244 L214 190 H193 Z" fill="#E5AE17" stroke="#E5AE17" stroke-width="3" stroke-linejoin="round"/>

    <!-- title -->
    <g font-family="Bahnschrift, 'DIN Alternate', 'DIN Condensed', 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="700">
      <text x="350" y="138" font-size="66" fill="#E1E6E0" textLength="860" lengthAdjust="spacingAndGlyphs">SCRAPPER’S DIGITAL GUIDE</text>
      <text x="350" y="212" font-size="66" fill="#E5AE17" textLength="610" lengthAdjust="spacingAndGlyphs">TO THE APOCALYPSE</text>
    </g>
    <text x="352" y="268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#97A3AA">I need this part. What should I strip, and where should I look?</text>

    <!-- what it runs on -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">
      <rect x="352" y="300" width="150" height="38" rx="19" fill="#E5AE17"/>
      <text x="427" y="324" text-anchor="middle" fill="#231C05" textLength="118" lengthAdjust="spacingAndGlyphs">100% OFFLINE</text>
      <rect x="514" y="300" width="186" height="38" rx="19" fill="none" stroke="#E5AE17" stroke-width="2"/>
      <text x="607" y="324" text-anchor="middle" fill="#E5AE17" textLength="152" lengthAdjust="spacingAndGlyphs">NOMAD-READY APP</text>
      <rect x="712" y="300" width="232" height="38" rx="19" fill="none" stroke="#62B9A6" stroke-width="2"/>
      <text x="828" y="324" text-anchor="middle" fill="#62B9A6" textLength="198" lengthAdjust="spacingAndGlyphs">PHONE · PI · CYBERDECK</text>
      <rect x="956" y="300" width="122" height="38" rx="19" fill="none" stroke="#97A3AA" stroke-width="2"/>
      <text x="1017" y="324" text-anchor="middle" fill="#E1E6E0" textLength="90" lengthAdjust="spacingAndGlyphs">LORA MESH</text>
      <rect x="1090" y="300" width="110" height="38" rx="19" fill="none" stroke="#97A3AA" stroke-width="2"/>
      <text x="1145" y="324" text-anchor="middle" fill="#E1E6E0" textLength="78" lengthAdjust="spacingAndGlyphs">AI TOOLS</text>
    </g>
  </g>
</svg>
