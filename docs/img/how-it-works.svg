<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 290" width="1280" height="290" role="img" aria-labelledby="t d">
  <title id="t">How it works</title>
  <desc id="d">1. Need a part. 2. What to strip: devices ranked by how easy, common and overlooked they are. 3. Where to look: buildings most likely to still have them. 4. Get it out safely: hazards, tools and steps. 5. Build with it: guides from fire to running a workshop.</desc>
  <defs>
    <clipPath id="card"><rect width="1280" height="290" rx="18"/></clipPath>
    <pattern id="hazard" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#E5AE17"/>
      <rect x="12" width="12" height="24" fill="#1B2A35"/>
    </pattern>
    <path id="chev" d="M-7 -12 L5 0 L-7 12" fill="none" stroke="#E5AE17" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle id="disc" r="40" fill="#1B2A35"/>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="290" fill="#ECEEE9"/>
    <rect width="1280" height="10" fill="url(#hazard)"/>
  </g>
  <rect x="1" y="1" width="1278" height="288" rx="18" fill="none" stroke="#B6BDB5" stroke-width="2"/>

  <use href="#chev" x="256" y="88"/>
  <use href="#chev" x="512" y="88"/>
  <use href="#chev" x="768" y="88"/>
  <use href="#chev" x="1024" y="88"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <!-- 1 -->
    <g transform="translate(128 0)">
      <use href="#disc" y="88"/>
      <g transform="translate(0 88)" fill="none" stroke="#E5AE17" stroke-width="3.5" stroke-linecap="round">
        <circle cx="-4" cy="-4" r="12"/><path d="M5 5 L15 15"/>
      </g>
      <text y="160" font-size="13" font-weight="700" fill="#9A3C1C" letter-spacing="2">STEP 1</text>
      <text y="190" font-size="22" font-weight="700" fill="#1B2A35">Need a part</text>
      <text y="220" font-size="15" fill="#55626A">12V motor, LM2596,</text>
      <text y="241" font-size="15" fill="#55626A">keep food cold</text>
    </g>
    <!-- 2 -->
    <g transform="translate(384 0)">
      <use href="#disc" y="88"/>
      <g transform="translate(0 88)" fill="none" stroke="#E5AE17" stroke-width="3.5" stroke-linejoin="round">
        <rect x="-17" y="-12" width="34" height="24" rx="3"/><rect x="-12" y="-7" width="18" height="14" rx="1.5"/>
        <circle cx="11" cy="-3" r="1.6" fill="#E5AE17" stroke="none"/><circle cx="11" cy="4" r="1.6" fill="#E5AE17" stroke="none"/>
      </g>
      <text y="160" font-size="13" font-weight="700" fill="#9A3C1C" letter-spacing="2">STEP 2</text>
      <text y="190" font-size="22" font-weight="700" fill="#1B2A35">What to strip</text>
      <text y="220" font-size="15" fill="#55626A">Devices ranked by ease,</text>
      <text y="241" font-size="15" fill="#55626A">how common, overlooked</text>
    </g>
    <!-- 3 -->
    <g transform="translate(640 0)">
      <use href="#disc" y="88"/>
      <g transform="translate(0 88)" fill="none" stroke="#E5AE17" stroke-width="3.5" stroke-linejoin="round">
        <path d="M-17 15 V-1 L0 -15 L17 -1 V15 Z"/><rect x="-5" y="4" width="10" height="11"/>
      </g>
      <text y="160" font-size="13" font-weight="700" fill="#9A3C1C" letter-spacing="2">STEP 3</text>
      <text y="190" font-size="22" font-weight="700" fill="#1B2A35">Where to look</text>
      <text y="220" font-size="15" fill="#55626A">Buildings most likely</text>
      <text y="241" font-size="15" fill="#55626A">to still have them</text>
    </g>
    <!-- 4 -->
    <g transform="translate(896 0)">
      <use href="#disc" y="88"/>
      <g transform="translate(0 88)" fill="none" stroke="#E5AE17" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 -16 L17 13 H-17 Z"/><path d="M0 -5 V3"/>
        <circle cy="8.5" r="1.8" fill="#E5AE17" stroke="none"/>
      </g>
      <text y="160" font-size="13" font-weight="700" fill="#9A3C1C" letter-spacing="2">STEP 4</text>
      <text y="190" font-size="22" font-weight="700" fill="#1B2A35">Get it out safely</text>
      <text y="220" font-size="15" fill="#55626A">Hazards, tools and</text>
      <text y="241" font-size="15" fill="#55626A">steps for each part</text>
    </g>
    <!-- 5 -->
    <g transform="translate(1152 0)">
      <use href="#disc" y="88"/>
      <g transform="translate(0 88)" fill="none" stroke="#E5AE17">
        <circle r="13" stroke-width="7" stroke-dasharray="5.105 5.105"/>
        <circle r="9.5" stroke-width="4"/>
      </g>
      <text y="160" font-size="13" font-weight="700" fill="#9A3C1C" letter-spacing="2">STEP 5</text>
      <text y="190" font-size="22" font-weight="700" fill="#1B2A35">Build with it</text>
      <text y="220" font-size="15" fill="#55626A">Guides from fire</text>
      <text y="241" font-size="15" fill="#55626A">to running a workshop</text>
    </g>
  </g>
</svg>
